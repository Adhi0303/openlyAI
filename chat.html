<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Chat</title>
  <link href="./src/styles/common.css" rel="stylesheet" />
  <!-- PrismJS theme for syntax highlighting -->
  <link rel="stylesheet" href="./node_modules/prismjs/themes/prism-tomorrow.min.css" />
  <style>
    /* Font Awesome now loaded via <link> above */

    body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
    }

    .chat-container {
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg,
          rgba(0, 0, 0, 0.3) 0%,
          rgba(20, 20, 20, 0.4) 100%);
      backdrop-filter: blur(25px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      -webkit-app-region: drag;
    }

    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      cursor: move;
      flex-shrink: 0;
    }

    .header-title {
      color: rgba(255, 255, 255, 0.55) !important;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
      text-shadow: none;
    }

    .header-title i {
      color: rgba(255, 255, 255, 0.55) !important;
    }

    /* Header actions (e.g., Clear History) */
    .header-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.5) !important;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-button:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.8) !important;
    }

    .recording-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      animation: pulse 2s infinite;
      display: none;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.4;
        transform: scale(1);
      }

      50% {
        opacity: 0.8;
        transform: scale(1.1);
      }
    }

    .chat-messages {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-app-region: no-drag;
      box-sizing: border-box;
    }

    .message {
      margin-bottom: 14px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 2px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      word-wrap: break-word;
      word-break: break-word;
      position: relative;
    }

    .message-role-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.5) !important;
    }

    .message.transcription {
      background: rgba(255, 255, 255, 0.04);
      border-left: 2px solid rgba(255, 255, 255, 0.35);
    }

    .message.system {
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid rgba(255, 255, 255, 0.2);
    }

    .message.error {
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid rgba(255, 255, 255, 0.3);
    }

    .message.user {
      background: rgba(255, 255, 255, 0.05);
      border-left: 2px solid rgba(255, 255, 255, 0.4);
    }

    .message.assistant {
      background: rgba(255, 255, 255, 0.03);
      border-left: 2px solid rgba(255, 255, 255, 0.3);
      display: block;
    }

    .message.assistant .message-text {
      white-space: pre-wrap;
      word-wrap: break-word;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .message.assistant *,
    .message.assistant .bullet-point,
    .message.assistant .numbered-point,
    .message.assistant strong,
    .message.assistant em,
    .message.assistant code,
    .message.assistant pre,
    .message.assistant ul,
    .message.assistant ol,
    .message.assistant li,
    .message.assistant h1,
    .message.assistant h2,
    .message.assistant h3,
    .message.assistant h4,
    .message.assistant h5,
    .message.assistant h6,
    .message.assistant p,
    .message.assistant blockquote {
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      color: rgba(255, 255, 255, 0.6) !important;
    }

    .message.assistant .bullet-point {
      margin: 4px 0;
      padding-left: 8px;
      line-height: 1.4;
    }

    .message.assistant .numbered-point {
      margin: 4px 0;
      padding-left: 16px;
      line-height: 1.4;
      position: relative;
      counter-increment: list-counter;
    }

    .message.assistant .numbered-point::before {
      content: counter(list-counter) ". ";
      position: absolute;
      left: 0;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6) !important;
    }

    .message.assistant {
      counter-reset: list-counter;
    }

    .message.assistant strong {
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75) !important;
    }

    .message.assistant em {
      font-style: italic;
      color: rgba(255, 255, 255, 0.6) !important;
    }

    .message.assistant code {
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: inline;
    }

    .message.assistant pre {
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 12px;
      border-radius: 6px;
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6) !important;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 8px 0;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message.assistant pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      border: none;
      display: block;
      color: rgba(255, 255, 255, 0.6) !important;
    }

    /* Copy button in code blocks */
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.5);
      color: rgba(255, 255, 255, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 3px 8px;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8) !important;
    }

    .copy-btn.copied {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.8) !important;
    }

    .message.assistant ul,
    .message.assistant ol {
      margin: 8px 0;
      padding-left: 20px;
    }

    .message.assistant li {
      margin: 4px 0;
      line-height: 1.4;
    }

    .message.assistant h1,
    .message.assistant h2,
    .message.assistant h3,
    .message.assistant h4,
    .message.assistant h5,
    .message.assistant h6 {
      margin: 12px 0 8px 0;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75) !important;
    }

    .message.assistant h1 {
      font-size: 15px;
    }

    .message.assistant h2 {
      font-size: 14px;
    }

    .message.assistant h3 {
      font-size: 13px;
    }

    .message.assistant h4,
    .message.assistant h5,
    .message.assistant h6 {
      font-size: 12px;
    }

    .message.assistant p {
      margin: 8px 0;
    }

    .message.assistant blockquote {
      border-left: 2px solid rgba(255, 255, 255, 0.25);
      padding-left: 12px;
      margin: 8px 0;
      font-style: italic;
      color: rgba(255, 255, 255, 0.6) !important;
    }

    /* Prism syntax highlighting strictly monochrome */
    .token,
    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata,
    .token.punctuation,
    .token.property,
    .token.tag,
    .token.boolean,
    .token.number,
    .token.constant,
    .token.symbol,
    .token.deleted,
    .token.selector,
    .token.attr-name,
    .token.string,
    .token.char,
    .token.builtin,
    .token.inserted,
    .token.operator,
    .token.entity,
    .token.url,
    .token.atrule,
    .token.attr-value,
    .token.keyword,
    .token.function,
    .token.class-name,
    .token.regex,
    .token.important,
    .token.variable {
      color: rgba(255, 255, 255, 0.6) !important;
      background: transparent !important;
    }

    /* Thinking indicator animation */
    .thinking-dots {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .thinking-dots .dot {
      color: rgba(255, 255, 255, 0.5) !important;
      opacity: 0.5;
      animation: thinking 1.4s infinite ease-in-out;
    }

    .thinking-dots .dot:nth-child(1) {
      animation-delay: 0s;
    }

    .thinking-dots .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .thinking-dots .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes thinking {

      0%,
      80%,
      100% {
        opacity: 0.4;
        transform: scale(1);
      }

      40% {
        opacity: 0.9;
        transform: scale(1.2);
      }
    }

    .message.thinking {
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-time {
      color: rgba(255, 255, 255, 0.35) !important;
      font-size: 10px;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .message-text {
      color: rgba(255, 255, 255, 0.6) !important;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      max-width: 100%;
      display: block;
    }

    .message-text .math {
      font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.6) !important;
    }

    .message-text sup,
    .message-text sub {
      font-size: 0.72em;
      line-height: 0;
    }

    /* Clipboard-relay input hint banner */
    .clipboard-hint {
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin: 0 16px 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5) !important;
      line-height: 1.4;
      -webkit-app-region: no-drag;
    }

    .clipboard-hint-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .clipboard-hint-text kbd {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 10px;
      font-family: inherit;
      color: rgba(255, 255, 255, 0.55);
    }

    .chat-input {
      padding: 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      -webkit-app-region: no-drag !important;
      pointer-events: auto !important;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .input-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      -webkit-app-region: no-drag !important;
      pointer-events: auto !important;
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6) !important;
      font-size: 13px;
      outline: none;
      resize: none;
      line-height: 1.4;
      min-height: 28px;
      max-height: 120px;
      overflow-y: auto;
      -webkit-app-region: no-drag !important;
      pointer-events: auto !important;
      cursor: text !important;
    }

    .input-field:focus {
      outline: none;
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.45) !important;
      font-style: italic;
    }

    .send-button,
    .mic-button,
    .clear-input-button {
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 5px 8px;
      color: rgba(255, 255, 255, 0.5) !important;
      cursor: pointer !important;
      transition: all 0.15s ease;
      -webkit-app-region: no-drag !important;
      pointer-events: auto !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-button i,
    .mic-button i,
    .clear-input-button i {
      pointer-events: none;
      color: rgba(255, 255, 255, 0.5) !important;
      font-size: 13px;
    }

    .send-button:hover,
    .mic-button:hover,
    .clear-input-button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.8) !important;
    }

    .send-button:hover i,
    .mic-button:hover i,
    .clear-input-button:hover i {
      color: rgba(255, 255, 255, 0.8) !important;
    }

    .mic-button.recording {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8) !important;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
    }

    .status-message {
      text-align: center;
      color: rgba(255, 255, 255, 0.45) !important;
      font-size: 11px;
      padding: 16px;
      font-style: italic;
    }

    .error-message {
      color: rgba(255, 255, 255, 0.45) !important;
      font-size: 11px;
      padding: 8px;
      text-align: center;
    }

    .help-text {
      color: rgba(255, 255, 255, 0.45) !important;
      font-size: 11px;
      text-align: center;
      padding: 8px;
    }

    .interaction-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: rgba(255, 255, 255, 0.6) !important;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .interaction-indicator.show {
      opacity: 1;
    }

    .interaction-indicator.interactive {
      background: rgba(255, 255, 255, 0.15);
    }

    .interaction-indicator.non-interactive {
      background: rgba(0, 0, 0, 0.8);
    }

    /* Minimalist Listening Animation */
    .listening-indicator {
      display: none;
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
      z-index: 1000;
      pointer-events: none;
    }

    .listening-indicator.active {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .listening-wave {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .wave-bar {
      width: 2px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 1px;
      animation: waveAnimation 1.2s infinite ease-in-out;
    }

    .wave-bar:nth-child(1) {
      height: 8px;
      animation-delay: 0s;
    }

    .wave-bar:nth-child(2) {
      height: 12px;
      animation-delay: 0.15s;
    }

    .wave-bar:nth-child(3) {
      height: 16px;
      animation-delay: 0.3s;
    }

    .wave-bar:nth-child(4) {
      height: 12px;
      animation-delay: 0.45s;
    }

    .wave-bar:nth-child(5) {
      height: 8px;
      animation-delay: 0.6s;
    }

    @keyframes waveAnimation {

      0%,
      100% {
        transform: scaleY(0.3);
        opacity: 0.4;
      }

      50% {
        transform: scaleY(1);
        opacity: 0.8;
      }
    }

    .listening-text {
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .listening-duration {
      color: rgba(255, 255, 255, 0.5);
      font-size: 10px;
      font-family: monospace;
      margin-left: 4px;
    }

    /* Interim text overlay */
    .interim-overlay {
      position: fixed;
      bottom: 80px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      color: rgba(255, 255, 255, 0.6) !important;
      font-size: 12px;
      font-style: italic;
      z-index: 999;
      pointer-events: none;
      display: none;
    }

    .interim-overlay.active {
      display: block;
    }
  </style>
</head>

<body>
  <div class="chat-container" id="chatContainer">
    <div class="chat-header">
      <div class="header-title">
        <i class="fas fa-terminal"></i>
        Question (input) &amp; Answer (output)
        <div class="recording-indicator" id="recordingIndicator"></div>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="clearHistoryBtn" title="Clear chat history">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>

    <!-- Interim Text Overlay -->
    <div class="interim-overlay" id="interimOverlay"></div>

    <div class="chat-messages" id="chatMessages"></div>

    <!-- Typing mode hint (shown by Ctrl+Shift+., hidden after send/dismiss) -->
    <div id="clipboardHint" class="clipboard-hint" style="display:none">
      <span class="clipboard-hint-icon">⌨️</span>
      <span class="clipboard-hint-text">
        <strong>Typing Mode ON</strong> &mdash; type your message below, then press <kbd>Ctrl+Shift+/</kbd> to send and
        return focus to Chrome &mdash; or press <kbd>Esc</kbd> to cancel
      </span>
    </div>

    <div class="chat-input">
      <div class="input-container">
        <textarea class="input-field" placeholder="Question (input)... type or press Alt+R" id="messageInput"
          rows="1"></textarea>
        <button class="clear-input-button" id="clearChatInputBtn" type="button" title="Clear text (Esc)">
          <i class="fas fa-times"></i>
        </button>
        <button class="mic-button" id="micButton" type="button" title="Voice recording (Alt+R)">
          <i class="fas fa-microphone"></i>
        </button>
        <button class="send-button" id="sendButton" type="button" title="Send message (Enter)">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
  <script src="lib/markdown.js"></script>
  <script src="lib/mathrender.js"></script>
  <!-- PrismJS core and autoloader for language components -->
  <script src="./node_modules/prismjs/prism.min.js"></script>
  <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>

  <script>
    // Configure Prism autoloader
    try { if (window.Prism && Prism.plugins && Prism.plugins.autoloader) { Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/'; } } catch (_) { }
  </script>
  <script>
    // Use electronAPI from preload script instead of direct require
    const whysperAPI = window.electronAPI;

    const chatMessages = document.getElementById('chatMessages');
    const recordingIndicator = document.getElementById('recordingIndicator');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const micButton = document.getElementById('micButton');
    const chatContainer = document.getElementById('chatContainer');
    const listeningIndicator = document.getElementById('listeningIndicator');
    const listeningDuration = document.getElementById('listeningDuration');
    const interimOverlay = document.getElementById('interimOverlay');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    let isRecording = false;
    let isInteractive = true;
    let listeningStartTime = null;
    let listeningTimer = null;
    let speechAvailable = false;

    // Chat persistence and deduplication
    const CHAT_HISTORY_KEY = 'opencluely_chat_history_v1';
    let chatHistory = [];
    const recentResponseHashes = new Set();
    const RECENT_HASH_LIMIT = 50;

    function hashString(str) {
      try {
        let h = 2166136261 >>> 0; // FNV-1a
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return (h >>> 0).toString(16);
      } catch (_) {
        return String(str?.length || 0);
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory.slice(-500)));
      } catch (e) {
        console.warn('Failed to save history', e);
      }
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(CHAT_HISTORY_KEY);
        if (!raw) return;
        const items = JSON.parse(raw);
        if (Array.isArray(items)) {
          chatHistory = items;
          // Render
          items.forEach(item => {
            if (item.kind === 'message') {
              addMessage(item.text, item.type, true);
            } else if (item.kind === 'snippet') {
              addCodeSnippet(item.language, item.code, true);
            }
          });
        }
      } catch (e) {
        console.warn('Failed to load history', e);
      }
    }

    function clearChatHistory(skipConfirm = false) {
      if (!skipConfirm) {
        const ok = confirm('Clear chat history?');
        if (!ok) return;
      }
      chatHistory = [];
      saveHistory();
      // Clear DOM
      if (chatMessages) chatMessages.innerHTML = '';
    }

    function applyMicVisibility() {
      if (micButton) {
        micButton.style.display = speechAvailable ? '' : 'none';
      }
    }

    async function initSpeechAvailability() {
      try {
        if (window.electronAPI && window.electronAPI.getSpeechAvailability) {
          speechAvailable = await window.electronAPI.getSpeechAvailability();
          applyMicVisibility();
        }
      } catch (e) {
        speechAvailable = false;
        applyMicVisibility();
      }
    }

    // Listen for availability changes
    if (whysperAPI && whysperAPI.onSpeechAvailability) {
      whysperAPI.onSpeechAvailability((event, data) => {
        speechAvailable = !!(data && data.available);
        applyMicVisibility();
      });
    }

    // Also capture generic LLM responses (from OCR/screenshot flows)
    if (whysperAPI && whysperAPI.onLlmResponse) {
      whysperAPI.onLlmResponse((event, data) => {
        try { hideThinkingIndicator(); } catch (_) { }
        if (data && data.response) {
          renderAssistantResponse(data.response);
        }
      });
    }

    if (whysperAPI && whysperAPI.onLlmError) {
      whysperAPI.onLlmError((event, data) => {
        try { hideThinkingIndicator(); } catch (_) { }
        const errMsg = data && data.error ? data.error : 'Failed to generate response';
        addMessage(`Error: ${errMsg}`, 'error');
      });
    }

    // Clear on session-cleared from main
    if (whysperAPI && whysperAPI.onSessionCleared) {
      whysperAPI.onSessionCleared(() => {
        clearChatHistory(true);
      });
    }

    // Initialize availability and history
    loadHistory();
    initSpeechAvailability();

    // Basic message function with markdown support for assistant messages
    function addMessage(text, type = 'user', skipPersist = false) {
      if (!chatMessages) {
        console.error('Chat messages element not found!');
        return;
      }

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;

      const roleLabel = document.createElement('div');
      roleLabel.className = 'message-role-label';
      if (type === 'user') {
        roleLabel.textContent = 'Question (input)';
      } else if (type === 'assistant') {
        roleLabel.textContent = 'Answer (output)';
      } else {
        roleLabel.textContent = 'System';
      }

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      timeDiv.textContent = new Date().toLocaleTimeString();

      const textDiv = document.createElement('div');
      textDiv.className = 'message-text';

      // Format assistant messages as markdown
      if (type === 'assistant') {
        textDiv.innerHTML = formatMarkdown(text);
        if (window.renderMathInElement) window.renderMathInElement(textDiv);
      } else {
        textDiv.textContent = text;
      }

      messageDiv.appendChild(roleLabel);
      messageDiv.appendChild(timeDiv);
      messageDiv.appendChild(textDiv);

      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      if (!skipPersist) {
        chatHistory.push({ kind: 'message', type, text });
        saveHistory();
      }
    }

    // Markdown formatter using markdown.js library
    function formatMarkdown(text) {
      if (!text) return '';

      try {
        if (typeof markdown !== 'undefined' && markdown.toHTML) {
          return markdown.toHTML(text);
        } else {
          console.warn('Markdown library not loaded, falling back to basic formatting');
          return text
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/`(.+?)`/g, '<code>$1</code>')
            .replace(/\n/g, '<br>');
        }
      } catch (error) {
        console.error('Markdown parsing failed:', error);
        return text.replace(/\n/g, '<br>');
      }
    }

    // Show thinking indicator
    function showThinkingIndicator() {
      const thinkingDiv = document.createElement('div');
      thinkingDiv.className = 'message assistant thinking';
      thinkingDiv.id = 'thinking-indicator';

      const roleLabel = document.createElement('div');
      roleLabel.className = 'message-role-label';
      roleLabel.textContent = 'Answer (output) — Generating...';

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      timeDiv.textContent = new Date().toLocaleTimeString();

      const textDiv = document.createElement('div');
      textDiv.className = 'message-text thinking-dots';
      textDiv.innerHTML = '<span class="dot">•</span><span class="dot">•</span><span class="dot">•</span>';

      thinkingDiv.appendChild(roleLabel);
      thinkingDiv.appendChild(timeDiv);
      thinkingDiv.appendChild(textDiv);

      chatMessages.appendChild(thinkingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Hide thinking indicator
    function hideThinkingIndicator() {
      const thinkingIndicator = document.getElementById('thinking-indicator');
      if (thinkingIndicator) {
        thinkingIndicator.remove();
      }
    }

    // Minimalist Listening Animation Functions
    function showListeningAnimation() {
      if (listeningIndicator) {
        listeningIndicator.classList.add('active');

        // Start timer
        listeningStartTime = Date.now();
        listeningTimer = setInterval(() => {
          if (listeningStartTime && listeningDuration) {
            const elapsed = Math.floor((Date.now() - listeningStartTime) / 1000);
            listeningDuration.textContent = `${elapsed}s`;
          }
        }, 1000);
      }
    }

    function hideListeningAnimation() {
      if (listeningIndicator) {
        listeningIndicator.classList.remove('active');
      }

      // Hide interim overlay
      if (interimOverlay) {
        interimOverlay.classList.remove('active');
      }

      // Clear timer
      if (listeningTimer) {
        clearInterval(listeningTimer);
        listeningTimer = null;
      }

      listeningStartTime = null;
    }

    let speechPrefix = '';
    let userIsEditingChat = false;
    let chatSyncTimer = null;

    function updateChatInputWithTranscription(text) {
      if (!messageInput) return;
      // Never overwrite if user is actively focusing, deleting, or typing!
      if (userIsEditingChat || document.activeElement === messageInput) {
        return;
      }

      const clean = (text || '').trim();
      if (!clean) return;

      if (speechPrefix) {
        messageInput.value = `${speechPrefix} ${clean}`;
      } else {
        messageInput.value = clean;
      }
      autoGrow(messageInput);
      if (document.activeElement !== messageInput) {
        messageInput.scrollTop = messageInput.scrollHeight;
      }
    }

    // Recording Event Handlers
    function handleRecordingStarted() {
      isRecording = true;

      if (recordingIndicator) {
        recordingIndicator.style.display = 'block';
      }
      if (micButton) {
        micButton.classList.add('recording');
      }

      speechPrefix = '';
      userIsEditingChat = false;
      if (messageInput) {
        messageInput.value = '';
        autoGrow(messageInput);
      }

      showListeningAnimation();
    }

    function handleRecordingStopped() {
      isRecording = false;
      speechPrefix = '';

      if (recordingIndicator) {
        recordingIndicator.style.display = 'none';
      }
      if (micButton) {
        micButton.classList.remove('recording');
      }

      hideListeningAnimation();
    }

    function handleTranscription(text) {
      updateChatInputWithTranscription(text);
    }

    // Helpers to capture AI response into chat (text + snippets)
    function extractCodeBlocks(text) {
      if (!text) return [];
      const blocks = [];
      const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
      let match;
      while ((match = regex.exec(text)) !== null) {
        const info = (match[2] || '').trim();
        const langToken = info.split(/\s+/)[0] || 'text';
        blocks.push({ language: langToken, code: match[3], fullMatch: match[0] });
      }
      return blocks;
    }
    function stripCodeBlocks(text, blocks) {
      let result = text || '';
      blocks.forEach(b => { result = result.replace(b.fullMatch, ''); });
      return result.replace(/\n\s*\n\s*\n/g, '\n\n').trim();
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }
    function attachCopy(btn, codeText) {
      if (!btn) return;
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        try {
          let ok = false;
          if (window.electronAPI && typeof window.electronAPI.copyToClipboard === 'function') {
            ok = await window.electronAPI.copyToClipboard(codeText);
          }
          if (!ok) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(codeText);
              ok = true;
            } else {
              const ta = document.createElement('textarea');
              ta.value = codeText;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              ta.remove();
              ok = true;
            }
          }
          if (ok) {
            btn.classList.add('copied');
            const original = btn.textContent;
            btn.textContent = 'Copied';
            setTimeout(() => { btn.classList.remove('copied'); btn.textContent = original || 'Copy'; }, 1200);
          }
        } catch (err) {
          console.warn('Copy failed', err);
        }
      });
    }
    function addCodeSnippet(language, code, skipPersist = false) {
      if (!chatMessages) return;
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message assistant';

      const roleLabel = document.createElement('div');
      roleLabel.className = 'message-role-label';
      const lang = (language || 'text').toUpperCase();
      roleLabel.textContent = `Answer (output) — Snippet: ${lang}`;

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      timeDiv.textContent = new Date().toLocaleTimeString();

      const textDiv = document.createElement('div');
      textDiv.className = 'message-text';

      const pre = document.createElement('pre');
      const codeEl = document.createElement('code');
      codeEl.className = `language-${(language || 'text').toLowerCase()}`;
      codeEl.innerHTML = escapeHtml(code || '');

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copy';
      attachCopy(copyBtn, code || '');

      pre.appendChild(copyBtn);
      pre.appendChild(codeEl);

      textDiv.appendChild(pre);

      messageDiv.appendChild(roleLabel);
      messageDiv.appendChild(timeDiv);
      messageDiv.appendChild(textDiv);
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try { if (window.Prism && Prism.highlightElement) { Prism.highlightElement(codeEl); } } catch (_) { }

      if (!skipPersist) {
        chatHistory.push({ kind: 'snippet', language: (language || 'text').toLowerCase(), code: code || '' });
        saveHistory();
      }
    }
    function renderAssistantResponse(response) {
      if (!response || typeof response !== 'string') return;
      // Deduplication: avoid processing the same response twice
      const normalized = response.trim();
      const h = hashString(normalized);
      if (recentResponseHashes.has(h)) return;
      recentResponseHashes.add(h);
      if (recentResponseHashes.size > RECENT_HASH_LIMIT) {
        const first = recentResponseHashes.values().next().value;
        recentResponseHashes.delete(first);
      }

      const blocks = extractCodeBlocks(response);
      const textOnly = stripCodeBlocks(response, blocks);
      // Add text response first (if any)
      if (textOnly && textOnly.trim().length) {
        addMessage(textOnly, 'assistant');
      }
      // Add each code snippet separately
      blocks.forEach(b => addCodeSnippet(b.language, b.code));
    }

    // Basic IPC Event Listeners - simplified

    // Listen for live streaming transcription events
    if (whysperAPI) {
      whysperAPI.onTranscriptionReceived((event, data) => {
        const text = (data && typeof data === 'object') ? data.text : data;
        updateChatInputWithTranscription(text);
      });

      whysperAPI.onInterimTranscription((event, data) => {
        const text = (data && typeof data === 'object') ? data.text : data;
        updateChatInputWithTranscription(text);
      });

      if (whysperAPI.onVoskFinalFragment) {
        whysperAPI.onVoskFinalFragment((event, data) => {
          const text = (data && typeof data === 'object') ? data.text : data;
          updateChatInputWithTranscription(text);
        });
      }

      // Listen for speech status
      whysperAPI.onSpeechStatus((event, data) => {
        if (data && data.status) {
          addMessage(data.status, 'system');

          if (data.status.includes('started') || data.status.includes('Recording')) {
            handleRecordingStarted();
          } else if (data.status.includes('stopped') || data.status.includes('ended')) {
            handleRecordingStopped();
          }
        }
      });

      // Listen for speech errors
      whysperAPI.onSpeechError((event, data) => {
        if (data && data.error) {
          addMessage(`Error in recognizing speech`, 'error');
          handleRecordingStopped();
        }
      });

      // Listen for other events
      whysperAPI.onRecordingStarted(() => {
        handleRecordingStarted();
      });

      whysperAPI.onRecordingStopped(() => {
        handleRecordingStopped();
      });

      whysperAPI.onSessionCleared(() => {
        addMessage('Session memory has been cleared', 'system');
      });

      if (whysperAPI.onTranscriptionCleared) {
        whysperAPI.onTranscriptionCleared(() => {
          speechPrefix = '';
          userIsEditingChat = false;
        });
      }

      // Replace transcription LLM handler to store text + snippets
      whysperAPI.onTranscriptionLlmResponse((event, data) => {
        if (data && data.response) {
          try { hideThinkingIndicator(); } catch (_) { }
          renderAssistantResponse(data.response);
        }
      });
    }

    // UI Event Listeners
    if (clearHistoryBtn) {
      clearHistoryBtn.addEventListener('click', () => clearChatHistory());
    }

    const clearChatInputBtn = document.getElementById('clearChatInputBtn');
    function handleClearChatInput() {
      speechPrefix = '';
      userIsEditingChat = false;
      if (messageInput) {
        messageInput.value = '';
        autoGrow(messageInput);
      }
      if (whysperAPI && whysperAPI.syncTranscribedText) {
        whysperAPI.syncTranscribedText('');
      }
      if (isRecording && whysperAPI && whysperAPI.stopSpeechRecognition) {
        whysperAPI.stopSpeechRecognition();
      }
    }

    if (clearChatInputBtn) {
      clearChatInputBtn.addEventListener('mousedown', (e) => e.stopPropagation());
      clearChatInputBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        handleClearChatInput();
      });
    }

    if (messageInput) {
      messageInput.addEventListener('mousedown', (e) => {
        e.stopPropagation();
      });
      messageInput.addEventListener('click', (e) => {
        e.stopPropagation();
        messageInput.focus();
      });
      messageInput.addEventListener('focus', () => {
        userIsEditingChat = true;
      });
      messageInput.addEventListener('blur', () => {
        setTimeout(() => {
          if (document.activeElement !== messageInput) {
            userIsEditingChat = false;
          }
        }, 200);
      });
      messageInput.addEventListener('input', () => {
        userIsEditingChat = true;
        speechPrefix = '';
        autoGrow(messageInput);
        const val = messageInput.value;
        clearTimeout(chatSyncTimer);
        chatSyncTimer = setTimeout(() => {
          if (whysperAPI && whysperAPI.syncTranscribedText) {
            whysperAPI.syncTranscribedText(val);
          }
        }, 30);
      });
      messageInput.addEventListener('keydown', async (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          handleClearChatInput();
          return;
        }
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          userIsEditingChat = false;
          const text = messageInput.value.trim();
          if (text) {
            speechPrefix = '';
            addMessage(text, 'user');
            messageInput.value = '';
            autoGrow(messageInput);

            if (whysperAPI && whysperAPI.syncTranscribedText) {
              whysperAPI.syncTranscribedText('');
            }

            if (isRecording && whysperAPI && whysperAPI.stopSpeechRecognition) {
              try { await whysperAPI.stopSpeechRecognition(); } catch (_) { }
            }

            setTimeout(() => { showThinkingIndicator(); }, 300);
            try {
              if (whysperAPI && whysperAPI.sendChatMessage) {
                await whysperAPI.sendChatMessage(text);
              }
            } catch (error) {
              console.error('Failed to send chat message to main process:', error);
              try { hideThinkingIndicator(); } catch (_) { }
              addMessage(`Failed to send message: ${error.message}`, 'error');
            }
          }
        }
        // If Shift+Enter, allow default to insert newline
      });
    }

    if (micButton) {
      micButton.addEventListener('mousedown', (e) => {
        e.stopPropagation();
      });
      micButton.addEventListener('click', async (e) => {
        e.stopPropagation();
        try {
          if (isRecording) {
            if (whysperAPI) {
              await whysperAPI.stopSpeechRecognition();
            }
          } else {
            if (whysperAPI) {
              await whysperAPI.startSpeechRecognition();
            }
          }
        } catch (error) {
          addMessage("Error in recognizing speech", 'error');
        }
      });
    }

    if (sendButton) {
      sendButton.addEventListener('mousedown', (e) => {
        e.stopPropagation();
      });
      sendButton.addEventListener('click', async (e) => {
        e.stopPropagation();
        userIsEditingChat = false;
        const text = messageInput ? messageInput.value.trim() : '';
        if (text) {
          speechPrefix = '';
          addMessage(text, 'user');
          messageInput.value = '';
          autoGrow(messageInput);

          if (whysperAPI && whysperAPI.syncTranscribedText) {
            whysperAPI.syncTranscribedText('');
          }

          if (isRecording && whysperAPI && whysperAPI.stopSpeechRecognition) {
            try { await whysperAPI.stopSpeechRecognition(); } catch (_) { }
          }

          // Show thinking indicator after user message
          setTimeout(() => {
            showThinkingIndicator();
          }, 300);

          // Send to main process for session memory storage and LLM processing
          try {
            if (whysperAPI && whysperAPI.sendChatMessage) {
              await whysperAPI.sendChatMessage(text);
            }
          } catch (error) {
            console.error('Failed to send chat message to main process:', error);
            try { hideThinkingIndicator(); } catch (_) { }
            addMessage(`Failed to send message: ${error.message}`, 'error');
          }
        }
      });
    }

    // Auto-resize for multiline textarea
    function autoGrow(el) {
      if (!el) return;
      el.style.height = 'auto';
      const max = 120; // keep within container limits
      el.style.height = Math.min(el.scrollHeight, max) + 'px';
    }
    if (messageInput) {
      autoGrow(messageInput);
    }

    // Global keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.altKey && e.key === 'r') {
        e.preventDefault();
        if (!isInteractive || !speechAvailable) return;
        micButton && micButton.click();
      }
    });

    // Initialize
    if (!chatHistory || chatHistory.length === 0) {
      addMessage('Press Alt+R to record or type below. Press Enter to send.', 'system');
    }

    // ── Clipboard-relay chat input (Ctrl+Shift+. / Ctrl+Shift+/) ─────────
    // This is the zero-tab-switch way to type while the chat window is
    // focusable:false.  Main process reads the clipboard and sends it here.
    const clipboardHint = document.getElementById('clipboardHint');
    let clipboardHintTimer = null;

    function showClipboardHint() {
      if (!clipboardHint) return;
      clipboardHint.style.display = 'flex';
      // Auto-dismiss after 30 s if user forgets
      clearTimeout(clipboardHintTimer);
      clipboardHintTimer = setTimeout(hideClipboardHint, 30000);
    }

    function hideClipboardHint() {
      if (!clipboardHint) return;
      clipboardHint.style.display = 'none';
      clearTimeout(clipboardHintTimer);
    }

    // Esc key — cancel typing mode: hide hint and tell main to return focus
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideClipboardHint();
        // Ask main process to blur our window and re-lock to non-focusable
        if (whysperAPI && whysperAPI.receive) {
          // Use the generic send channel — handled by chatSendClipboard with empty text
          window.electronAPI && window.electronAPI.invoke && window.electronAPI.invoke('chat-cancel-input');
        }
      }
    });

    // Ctrl+Shift+. → main process tells us to show the hint
    if (whysperAPI && whysperAPI.onChatActivateInput) {
      whysperAPI.onChatActivateInput(() => {
        showClipboardHint();
      });
    }

    // Ctrl+Shift+/ → main process delivers clipboard text; we send it
    if (whysperAPI && whysperAPI.onChatSendClipboard) {
      whysperAPI.onChatSendClipboard(async (event, data) => {
        const text = (data && data.text) ? data.text.trim() : '';
        if (!text) return;

        hideClipboardHint();

        // Show user message in chat
        addMessage(text, 'user');
        if (messageInput) messageInput.value = '';

        setTimeout(() => showThinkingIndicator(), 300);

        try {
          if (whysperAPI && whysperAPI.sendChatMessage) {
            await whysperAPI.sendChatMessage(text);
          }
        } catch (err) {
          console.error('Clipboard relay send failed:', err);
          addMessage('Failed to send message.', 'error');
        }
      });
    }
  </script>
</body>
